name: skyglide
description: "Skyglide, a tilt-controlled bird adventure through floating temples."
publish_to: 'none'
version: 1.3.0+10

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/flight/
    - assets/Barlow-OFL.txt
    - assets/Hind-OFL.txt
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/barlow-bold.ttf
          weight: 800
        - asset: assets/barlow-bold-italic.ttf
          weight: 800
          style: italic
    - family: Hind
      fonts:
        - asset: assets/hind-regular.ttf
        - asset: assets/hind-semibold.ttf
          weight: 600
